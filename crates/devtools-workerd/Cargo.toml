[package]
name = "devtools-workerd"
version = "0.1.0"
edition = "2021"
description = "D-Bus GUI worker for DevTools."

[dependencies]
base64 = "0.22"
devtools-core = { path = "../devtools-core" }
devtools-tools = { path = "../devtools-tools" }
gtk = "0.18"
ksni = { version = "0.3.6", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.36"
tempfile = "3"
wait-timeout = "0.2"
wry = "0.56.1"
zbus = { version = "4", default-features = false, features = ["async-io", "blocking"] }
