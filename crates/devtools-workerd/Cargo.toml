[package]
name = "devtools-workerd"
version = "0.1.0"
edition = "2021"
description = "D-Bus GUI worker for DevTools."

[dependencies]
base64 = "0.22"
devtools-core = { path = "../devtools-core" }
devtools-tools = { path = "../devtools-tools" }
global-hotkey = { package = "wayclip-global-hotkey", version = "=0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.36"
tempfile = "3"
wait-timeout = "0.2"
wry = { version = "0.56.1", features = ["devtools"] }
revelo = { version = "0.5.5", default-features = false, features = ["mmap"] }
rfd = "0.17.2"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["remote_desktop", "screencast", "screenshot", "tokio"] }
gtk = "0.18"
ksni = { version = "0.3.6", features = ["blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
zbus = { version = "4", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.6"
tray-icon = "0.21"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
