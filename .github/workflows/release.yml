name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up pnpm 11 and Node 26
        uses: pnpm/setup@v2
        with:
          version: 11.18.0
          runtime: node@26
          package-json-file: web/devtools-ui/package.json
          cache: true
          cache-dependency-path: web/devtools-ui/pnpm-lock.yaml
          install: false

      - name: Install frontend dependencies
        working-directory: web/devtools-ui
        run: pnpm install --frozen-lockfile

      - name: Build and verify frontend
        working-directory: web/devtools-ui
        run: pnpm check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release workspace
        run: cargo build --release --workspace --locked

      - name: Prepare x86_64 artifact
        run: |
          mkdir -p dist/assets
          cp target/release/devtools-runner dist/
          cp target/release/devtools-workerd dist/
          cp assets/org.kde.devtools.desktop dist/assets/
          cp assets/org.kde.devtools.service dist/assets/
          cp assets/org.loveyu.DevTools.service dist/assets/
          cp install.sh dist/
          tar -C dist -czf devtools-runner-x86_64-linux-gnu.tar.gz .
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            devtools-runner-x86_64-linux-gnu.tar.gz \
            --clobber
