name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            qrencode \
            tesseract-ocr \
            tesseract-ocr-eng \
            zbar-tools

      - name: Set up pnpm 11 and Node 26
        uses: pnpm/setup@v2
        with:
          version: 11.18.0
          runtime: node@26
          package-json-file: web/devtools-ui/package.json
          cache: true
          cache-dependency-path: web/devtools-ui/pnpm-lock.yaml
          install: false

      - name: Install frontend dependencies
        working-directory: web/devtools-ui
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality gate
        working-directory: web/devtools-ui
        run: pnpm check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build release workspace
        run: cargo build --release --workspace --locked

  windows-worker:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm 11 and Node 26
        uses: pnpm/setup@v2
        with:
          version: 11.18.0
          runtime: node@26
          package-json-file: web/devtools-ui/package.json
          cache: true
          cache-dependency-path: web/devtools-ui/pnpm-lock.yaml
          install: false

      - name: Build frontend bundle
        working-directory: web/devtools-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Windows Worker
        run: cargo check -p devtools-workerd --locked

      - name: Lint Windows Worker
        run: cargo clippy -p devtools-workerd --all-targets --locked -- -D warnings
